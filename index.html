<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Balance</title>
<style>
:root{--bg:#EAF0EE;--ink:#10303A;--mut:#4d6670;--card:#fff;--line:#c9d6d2;--a:#1B7F7A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Segoe UI",system-ui,sans-serif}
h1,h2,.brand{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;line-height:1.2}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--ink);color:#dbe9e6;padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:26px;color:#fff;margin:0 0 4px}
.lang{display:flex;gap:6px;margin:10px 0 18px}
.lang button{flex:1;padding:6px;border:1px solid #5d8a89;background:none;color:#dbe9e6;border-radius:6px;cursor:pointer;font:inherit}
.lang button.on{background:#dbe9e6;color:var(--ink);font-weight:700}
aside a{display:block;color:#dbe9e6;text-decoration:none;padding:5px 10px;border-radius:6px;font-size:15px}
aside a:hover,aside a.on{background:#ffffff1f}
aside a.on{font-weight:700}
.mh{margin:14px 0 2px;font-size:13px;color:#9fc3bf;font-weight:700;padding-left:10px;border-left:4px solid}
main{padding:36px clamp(18px,5vw,64px);max-width:860px}
h1{font-size:clamp(28px,4vw,42px);margin:6px 0 14px}
h2{font-size:21px;margin:0 0 12px}
.crumb{margin:0;font-weight:700;color:var(--mc,var(--a))}
.art{float:right;margin:0 0 10px 18px;width:120px;height:120px}
.txt p{max-width:68ch}
.act{background:var(--card);border:2px solid var(--mc,var(--a));border-radius:14px;padding:22px;margin:26px 0;clear:both}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{font:inherit;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:14px;cursor:pointer;color:var(--ink)}
.card.on{background:var(--mc,var(--a));color:#fff;border-color:transparent}
.card span{display:block;margin-top:8px;font-size:15px}
.opt{display:block;width:100%;text-align:left;font:inherit;margin:8px 0;padding:12px 14px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;color:var(--ink)}
.opt.ok{background:#d7f0e3;border-color:#2c8a5a}.opt.no{background:#fbe0e0;border-color:#b94a4a}
input[type=range]{width:100%;accent-color:var(--mc,var(--a))}
.big{font-size:22px;font-weight:700}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
label.ck input{margin-top:6px;width:18px;height:18px;accent-color:var(--mc,var(--a))}
.res{margin-top:14px;padding:12px 14px;border-left:5px solid var(--mc,var(--a));background:var(--bg);border-radius:0 8px 8px 0;min-height:24px}
.src{font-size:14px;color:var(--mut)}.src a{color:inherit}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.pn a,.btn{background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;border:0;font:inherit;cursor:pointer}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:20px 0}
.mods a{display:block;text-decoration:none;color:var(--ink);background:#fff;border-radius:12px;padding:16px;border-top:6px solid var(--mc)}
.mods small{display:block;color:var(--mut)}
.ref{padding-left:2em;text-indent:-2em;margin:0 0 12px;font-size:15px;word-break:break-word}
textarea{width:100%;min-height:150px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:10px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #E8A33D;outline-offset:2px}
@media(max-width:780px){.wrap{display:block}aside{position:static;height:auto}.art{width:80px;height:80px}}
@media(prefers-reduced-motion:no-preference){#beam{transition:transform .4s}}
</style>
</head>
<body>
<div class="wrap">
<aside><p class="brand">Digital Balance</p>
<div class="lang" role="group" aria-label="Language / Idioma"><button id="le">EN</button><button id="les">ES</button></div>
<nav id="nav"></nav></aside>
<main id="main" tabindex="-1"></main>
</div>
<script>
var lang='es',cur='home';
var t=function(a){return a[lang=='en'?0:1]};
var S={home:['Home','Inicio'],cred:['Credits and references','Créditos y referencias'],tap:['Tap each card to reveal it','Toca cada tarjeta para descubrirla'],src:['Sources','Fuentes'],prev:['Previous','Anterior'],next:['Next','Siguiente'],start:['Start with Module 1','Empieza por el Módulo 1'],copy:['Copy my plan','Copiar mi plan'],mod:['Module','Módulo']};
var M=[
{n:['Understanding digital wellbeing','Comprender el bienestar digital'],c:'#1B7F7A'},
{n:['Healthy screen habits','Hábitos saludables con pantallas'],c:'#4B3F8F'},
{n:['Mental and emotional wellbeing','Bienestar mental y emocional'],c:'#B4457A'},
{n:['Cybersecurity and online safety','Ciberseguridad y seguridad en línea'],c:'#2563A8'},
{n:['Building healthy digital routines','Construir rutinas digitales saludables'],c:'#8A6100'}];
var R={
who:'World Health Organization (1948)',lally:'Lally et al. (2010)',bull:'Bull et al. (2020)',cdc:'Centers for Disease Control and Prevention (n.d.)',harv:'Harvard Health Publishing (2020)',sg:'Office of the Surgeon General (2023)',nimh:'National Institute of Mental Health (n.d.)',cisa1:'Cybersecurity and Infrastructure Security Agency (n.d.-a, n.d.-b)',cisa2:'Cybersecurity and Infrastructure Security Agency (n.d.-c)',macan:'Macan et al. (1990)'};
var P=[
{m:0,t:['Digital wellbeing fundamentals','Fundamentos del bienestar digital'],s:'who',
p:['Digital wellbeing means using technology in a way that supports, rather than harms, your physical, mental and social health. It is not about quitting devices: it is about staying in control of them.|The World Health Organization describes health as a state of complete physical, mental and social well-being, not merely the absence of disease. Those three dimensions are a useful map for judging your own digital life.','El bienestar digital consiste en usar la tecnología de modo que apoye, y no perjudique, tu salud física, mental y social. No se trata de abandonar los dispositivos, sino de mantener el control sobre ellos.|La Organización Mundial de la Salud define la salud como un estado de completo bienestar físico, mental y social, y no solo la ausencia de enfermedad. Esas tres dimensiones sirven como mapa para evaluar tu propia vida digital.'],
a:{k:'cards',i:[[['Physical','Físico'],['Posture, eye strain and long sitting time linked to screens.','Postura, fatiga visual y mucho tiempo sentado frente a pantallas.']],[['Mental','Mental'],['Attention, mood and stress can change with how you use devices.','La atención, el ánimo y el estrés cambian según cómo uses los dispositivos.']],[['Social','Social'],['Online contact can add to or replace time with people in person.','El contacto en línea puede sumar o reemplazar el tiempo presencial con otras personas.']],[['Control','Control'],['Do you choose when to connect, or does the device choose for you?','¿Tú eliges cuándo conectarte o lo decide el dispositivo por ti?']]]}},
{m:0,t:['Digital habits and their impact','Hábitos digitales y su impacto'],s:'lally',
p:['A habit forms when a behavior is repeated in the same context until it becomes automatic. Notifications, boredom and a phone within reach are cues that trigger checking without a decision.|In a study by Lally and colleagues (2010), automaticity took 66 days on average to develop, with a wide range from 18 to 254 days. Changing a digital habit takes weeks, not days.','Un hábito se forma cuando una conducta se repite en el mismo contexto hasta volverse automática. Las notificaciones, el aburrimiento y tener el teléfono a la mano son señales que activan la revisión sin tomar una decisión.|En un estudio de Lally y colaboradores (2010), la automaticidad tardó en promedio 66 días en desarrollarse, con un rango amplio de 18 a 254 días. Cambiar un hábito digital toma semanas, no días.'],
a:{k:'slider',min:0,max:10,val:3,u:['hours per day of non-study phone use','horas al día de uso del teléfono fuera del estudio'],f:function(h){return['That is about '+Math.round(h*365)+' hours a year, roughly '+Math.round(h*365/24)+' full days. Is that time going where you want?','Son unas '+Math.round(h*365)+' horas al año, casi '+Math.round(h*365/24)+' días completos. ¿Ese tiempo va a donde tú quieres?']}}},
{m:1,t:['Screen time management','Gestión del tiempo de pantalla'],s:'bull',
p:['The WHO 2020 guidelines recommend that adults do 150 to 300 minutes of moderate physical activity per week and limit sedentary time. Long study sessions in front of a screen are mostly sedentary time.|The checklist below mixes that guidance with practical ideas of the author, such as silencing notifications and keeping a phone-free block.','Las directrices de la OMS de 2020 recomiendan que los adultos realicen entre 150 y 300 minutos de actividad física moderada por semana y limiten el tiempo sedentario. Las sesiones largas de estudio frente a una pantalla son, en su mayoría, tiempo sedentario.|La lista siguiente combina esa guía con ideas prácticas del autor, como silenciar notificaciones y mantener un bloque sin teléfono.'],
a:{k:'check',i:[['I stand up or stretch at least once an hour','Me levanto o estiro al menos una vez por hora'],['Notifications are off while I study','Tengo las notificaciones apagadas mientras estudio'],['I know my daily screen-time number','Conozco mi cifra diaria de tiempo de pantalla'],['I keep one phone-free block each day','Tengo un bloque diario sin teléfono'],['I do physical activity most days','Hago actividad física casi todos los días']],f:function(n){return n<2?['Start small: pick one habit for this week.','Empieza poco a poco: elige un hábito para esta semana.']:n<4?['Good base. Add one more habit to build on it.','Buena base. Suma un hábito más para reforzarla.']:['Strong routine. Keep reviewing it each month.','Rutina sólida. Revísala cada mes.']}}},
{m:1,t:['Sleep and digital devices','Sueño y dispositivos digitales'],s:'cdc,harv',
p:['The CDC states that adults aged 18 to 60 need 7 or more hours of sleep per night.|Harvard Health explains that evening exposure to blue light, which screens emit, can suppress melatonin and shift the body clock, so a screen-free wind-down before bed may help.','Los CDC indican que los adultos de 18 a 60 años necesitan dormir 7 horas o más por noche.|Harvard Health explica que la exposición nocturna a la luz azul, que emiten las pantallas, puede suprimir la melatonina y desplazar el reloj biológico, por lo que un cierre sin pantallas antes de dormir puede ayudar.'],
a:{k:'slider',min:3,max:10,val:7,u:['hours of sleep per night','horas de sueño por noche'],f:function(h){return h>=7?['Within the recommended 7+ hours. Protect it from late-night scrolling.','Dentro de las 7 horas o más recomendadas. Protégelo del scroll nocturno.']:['Below 7 hours: a deficit of '+(7-h)*7+' hours per week. Try moving screens out of the last hour before bed.','Menos de 7 horas: un déficit de '+(7-h)*7+' horas por semana. Prueba a retirar las pantallas la última hora antes de dormir.']}}},
{m:2,t:['Social media and emotional wellbeing','Redes sociales y bienestar emocional'],s:'sg',
p:['The U.S. Surgeon General advisory on social media says these platforms can offer connection and community but also carry risks, and that the evidence on overall effects is still developing.|Its focus is young people, but its message that outcomes depend on how, how long and why you use them is a useful lens for students too.','El informe del Cirujano General de EE. UU. sobre redes sociales señala que estas plataformas pueden ofrecer conexión y comunidad, pero también implican riesgos, y que la evidencia sobre sus efectos globales aún se está desarrollando.|Se centra en jóvenes, pero su idea de que el resultado depende de cómo, cuánto y para qué se usan sirve también como lente para estudiantes.'],
a:{k:'quiz',q:['You notice you feel worse after scrolling posts that make you compare yourself. What is the best first step?','Notas que te sientes peor después de ver publicaciones que te hacen compararte. ¿Cuál es el mejor primer paso?'],o:[['Scroll longer to find happier posts','Seguir desplazándote para encontrar publicaciones más alegres',0,'Longer exposure rarely fixes the cause.','Más exposición rara vez resuelve la causa.'],['Mute accounts that trigger comparison and set a time limit','Silenciar las cuentas que provocan comparación y fijar un límite de tiempo',1,'Correct: adjust what you see and how long you stay.','Correcto: ajustas lo que ves y cuánto tiempo te quedas.'],['Ignore it, it is only an app','Ignorarlo, solo es una aplicación',0,'Noticing the effect is useful information. Act on it.','Notar el efecto es información útil. Actúa sobre ella.']]}},
{m:2,t:['Digital stress and information overload','Estrés digital y sobrecarga de información'],s:'nimh',
p:['The U.S. National Institute of Mental Health describes stress as the brain and body response to demands, and notes that stress lasting a long time can affect health.|Constant messages, news and alerts can exceed what you can process at once. Recognizing the signs early helps you step back before it builds up.','El Instituto Nacional de Salud Mental de EE. UU. describe el estrés como la respuesta del cerebro y del cuerpo ante las demandas, y señala que el estrés prolongado puede afectar la salud.|Los mensajes, noticias y alertas constantes pueden superar lo que puedes procesar a la vez. Reconocer las señales a tiempo ayuda a frenar antes de que se acumule.'],
a:{k:'cards',i:[[['Body signals','Señales del cuerpo'],['Tension, tiredness or sleep trouble can accompany stress.','La tensión, el cansancio o los problemas de sueño pueden acompañar al estrés.']],[['Mind signals','Señales mentales'],['Trouble concentrating or feeling overwhelmed by notifications.','Dificultad para concentrarte o sensación de agobio por las notificaciones.']],[['What helps','Qué ayuda'],['Do one task at a time, check messages in batches, take real breaks.','Hacer una tarea a la vez, revisar mensajes por bloques y tomar descansos reales.']],[['When to get help','Cuándo pedir ayuda'],['If it lasts or affects daily life, talk to a professional or university wellbeing services.','Si dura o afecta tu vida diaria, habla con un profesional o con bienestar universitario.']]]}},
{m:3,t:['Protecting personal information','Proteger la información personal'],s:'cisa1',
p:['CISA, the U.S. cybersecurity agency, highlights four basic actions: use long, random and unique passwords, store them in a password manager, turn on multifactor authentication, and keep software updated.|Your university account, email and banking apps hold personal data. Each action below closes one common door.','CISA, la agencia de ciberseguridad de EE. UU., destaca cuatro acciones básicas: usar contraseñas largas, aleatorias y únicas, guardarlas en un gestor de contraseñas, activar la autenticación multifactor y mantener el software actualizado.|Tu cuenta universitaria, el correo y las apps bancarias guardan datos personales. Cada acción siguiente cierra una puerta común.'],
a:{k:'check',i:[['My passwords are long and different for each account','Mis contraseñas son largas y distintas en cada cuenta'],['I use a password manager','Uso un gestor de contraseñas'],['Multifactor authentication is on for my email','La autenticación multifactor está activa en mi correo'],['I install updates when they appear','Instalo las actualizaciones cuando aparecen']],f:function(n){return n<3?['Pick one action and do it today, starting with your email account.','Elige una acción y hazla hoy, empezando por tu cuenta de correo.']:['Solid protection. Review it whenever you create a new account.','Buena protección. Revísala cada vez que crees una cuenta nueva.']}}},
{m:3,t:['Recognizing digital threats','Reconocer amenazas digitales'],s:'cisa2',
p:['CISA lists common signs of phishing: urgent or emotional language, requests for personal or financial information, links that do not match the sender, and unexpected messages.|If you suspect a message, do not click or reply. Verify through the official website and report or delete it.','CISA enumera señales comunes de phishing: lenguaje urgente o emocional, solicitudes de datos personales o financieros, enlaces que no coinciden con el remitente y mensajes inesperados.|Si sospechas de un mensaje, no hagas clic ni respondas. Verifica en el sitio oficial y repórtalo o elimínalo.'],
a:{k:'quiz',q:['Message: "Your university account closes in 2 hours. Verify your password at bit.ly/xxxx". What do you do?','Mensaje: "Tu cuenta universitaria se cierra en 2 horas. Verifica tu contraseña en bit.ly/xxxx". ¿Qué haces?'],o:[['Click quickly before it closes','Hacer clic rápido antes de que se cierre',0,'Urgency is a classic phishing signal.','La urgencia es una señal clásica de phishing.'],['Do not click; check the official site and report it','No hacer clic; revisar el sitio oficial y reportarlo',1,'Correct: urgency, a short link and a password request are red flags.','Correcto: urgencia, enlace corto y petición de contraseña son señales de alerta.'],['Reply asking if it is real','Responder preguntando si es real',0,'Replying confirms your address is active.','Responder confirma que tu dirección está activa.']]}},
{m:4,t:['Time management strategies','Estrategias de gestión del tiempo'],s:'macan',
p:['In a study of college students, Macan and colleagues (1990) found that time-management behaviors such as setting goals, prioritizing and planning were associated with a greater sense of control over time and less stress.|The cards show common techniques; try one for a week before adding another.','En un estudio con universitarios, Macan y colaboradores (1990) encontraron que conductas de gestión del tiempo como fijar metas, priorizar y planificar se asociaron con mayor sensación de control del tiempo y menos estrés.|Las tarjetas muestran técnicas comunes; prueba una durante una semana antes de sumar otra.'],
a:{k:'cards',i:[[['Plan the week','Planificar la semana'],['Write deadlines and study blocks on Sunday.','Anota entregas y bloques de estudio el domingo.']],[['Prioritize','Priorizar'],['Separate what is urgent from what is important.','Separa lo urgente de lo importante.']],[['Time blocks','Bloques de tiempo'],['Study in focused blocks with notifications silenced.','Estudia en bloques concentrados con notificaciones silenciadas.']],[['Weekly review','Revisión semanal'],['Check what worked and adjust the plan.','Revisa qué funcionó y ajusta el plan.']]]}},
{m:4,t:['My personal digital wellbeing plan','Mi plan personal de bienestar digital'],s:'lally,bull,cdc',
p:['A plan works best when it is small and specific. Habits take weeks to settle, so choose a few commitments you can keep.|Select the ones that fit you. Your plan appears below and you can copy it.','Un plan funciona mejor cuando es pequeño y concreto. Los hábitos tardan semanas en asentarse, así que elige pocos compromisos que puedas cumplir.|Selecciona los que se ajusten a ti. Tu plan aparece abajo y puedes copiarlo.'],
a:{k:'plan',i:[['Silence notifications while I study','Silenciar notificaciones mientras estudio'],['Charge my phone outside the bedroom','Cargar el teléfono fuera del dormitorio'],['No screens during the last hour before bed','Sin pantallas la última hora antes de dormir'],['Stand up and stretch every hour','Levantarme y estirarme cada hora'],['Turn on multifactor authentication','Activar la autenticación multifactor'],['Review my week every Sunday','Revisar mi semana cada domingo']]}}
];

function art(m){var c=M[m].c;return '<svg class="art" viewBox="0 0 120 120" role="img" aria-label="'+t(M[m].n)+'" fill="'+c+'" stroke="'+c+'" stroke-linecap="round" stroke-linejoin="round">'+ART[m]+'</svg>'}
function nav(){var h='<a href="#home" class="'+(cur=='home'?'on':'')+'">'+t(S.home)+'</a>',n=0;
M.forEach(function(m,i){h+='<div class="mh" style="border-color:'+m.c+'">'+t(S.mod)+' '+(i+1)+'</div>';

document.getElementById('le').className=lang=='en'?'on':'';document.getElementById('les').className=lang=='es'?'on':''}

function render(){var h=location.hash.slice(1)||'home';cur=h;var el=document.getElementById('main'),x='';document.documentElement.lang=lang;
if(h=='home'){document.title='Digital Balance';el.style.setProperty('--mc','#1B7F7A');

el.innerHTML=x;var hs=document.getElementById('hs');function u(){var v=+hs.value;document.getElementById('hv').textContent=v;document.getElementById('beam').setAttribute('transform','rotate('+(-(v-4)*3)+' 150 40)');document.getElementById('hr').textContent=v<=4?(lang=='en'?'Your scale leans toward rest. Keep protecting sleep and movement.':'Tu balanza se inclina hacia el descanso. Sigue protegiendo el sueño y el movimiento.'):(lang=='en'?'Your scale leans toward screens by '+(v-4)+' h. There is no universal ideal: what matters is whether screens leave room for sleep, movement and people.':'Tu balanza se inclina '+(v-4)+' h hacia las pantallas. No hay un ideal universal: importa si las pantallas dejan espacio al sueño, al movimiento y a las personas.')}hs.oninput=u;u()}
else if(h=='credits'){document.title=t(S.cred);el.style.setProperty('--mc','#1B7F7A');
x='<h1>'+t(S.cred)+'</h1><p>'+(lang=='en'?'Texts were drafted with AI assistance and checked against the sources below. Illustrations are original vector drawings created for this project. The interface design and code are original.':'Los textos se redactaron con apoyo de IA y se contrastaron con las fuentes siguientes. Las ilustraciones son dibujos vectoriales originales creados para este proyecto. El diseño de la interfaz y el código son originales.')+'</p>'+REFS.map(function(r){return '<p class="ref">'+r+'</p>'}).join('');el.innerHTML=x}
else{var i=+h.slice(1);if(!(i>=0&&i<10)){location.hash='#home';return}
var p=P[i],m=M[p.m];document.title=t(p.t)+' | Digital Balance';el.style.setProperty('--mc',m.c);
x='<article><p class="crumb">'+t(S.mod)+' '+(p.m+1)+': '+t(m.n)+'</p><h1>'+t(p.t)+'</h1>'+art(p.m)+'<div class="txt">'+t(p.p).split('|').map(function(z){return '<p>'+z+'</p>'}).join('')+'</div><section class="act" id="act"></section><p class="src">'+t(S.src)+': '+srcs(p.s)+'. <a href="#credits">'+t(S.cred)+'</a></p><div class="pn"><a href="#'+(i?'p'+(i-1):'home')+'">'+t(S.prev)+'</a><a href="#'+(i<9?'p'+(i+1):'credits')+'">'+t(S.next)+'</a></div></article>';

function act(a,el){
if(a.k=='cards'){el.innerHTML='<h2>'+t(S.tap)+'</h2><div class="g">'+a.i.map(function(c){return '<button class="card" aria-expanded="false"><b>'+t(c[0])+'</b><span hidden>'+t(c[1])+'</span></button>'}).join('')+'</div>';
el.querySelectorAll('.card').forEach(function(b){b.onclick=function(){var s=b.querySelector('span');s.hidden=!s.hidden;b.classList.toggle('on');b.setAttribute('aria-expanded',!s.hidden)}})}
else if(a.k=='slider'){el.innerHTML='<label for="sl">'+t(a.u)+': <span class="big" id="sv"></span></label><input id="sl" type="range" min="'+a.min+'" max="'+a.max+'" value="'+a.val+'"><div class="res" id="sr" aria-live="polite"></div>';var sl=document.getElementById('sl');function u(){document.getElementById('sv').textContent=sl.value;document.getElementById('sr').textContent=t(a.f(+sl.value))}sl.oninput=u;u()}
else if(a.k=='check'){el.innerHTML=a.i.map(function(c){return '<label class="ck"><input type="checkbox"><span>'+t(c)+'</span></label>'}).join('')+'<div class="res" id="cr" aria-live="polite"></div>';var cs=el.querySelectorAll('input');function u(){var n=0;cs.forEach(function(c){if(c.checked)n++});document.getElementById('cr').textContent=n+'/'+cs.length+'. '+t(a.f(n))}cs.forEach(function(c){c.onchange=u});u()}
else if(a.k=='quiz'){el.innerHTML='<h2>'+t(a.q)+'</h2>'+a.o.map(function(o,j){return '<button class="opt" data-j="'+j+'">'+t(o)+'</button>'}).join('')+'<div class="res" id="qr" aria-live="polite"></div>';
el.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){var o=a.o[+b.dataset.j];el.querySelectorAll('.opt').forEach(function(x){x.disabled=true;if(a.o[+x.dataset.j][2])x.classList.add('ok')});if(!o[2])b.classList.add('no');document.getElementById('qr').textContent=lang=='en'?o[3]:o[4]}})}
else if(a.k=='plan'){el.innerHTML=a.i.map(function(c){return '<label class="ck"><input type="checkbox"><span>'+t(c)+'</span></label>'}).join('')+'<textarea id="pt" readonly aria-label="Plan"></textarea><button class="btn" id="pc" style="margin-top:10px">'+t(S.copy)+'</button>';var cs=el.querySelectorAll('input'),ta=document.getElementById('pt');function u(){var l=[];cs.forEach(function(c,j){if(c.checked)l.push('- '+t(a.i[j]))});ta.value=(lang=='en'?'My digital wellbeing plan':'Mi plan de bienestar digital')+'\n'+l.join('\n')}cs.forEach(function(c){c.onchange=u});u();document.getElementById('pc').onclick=function(){ta.select();try{navigator.clipboard.writeText(ta.value)}catch(e){document.execCommand('copy')}}}}
document.getElementById('le').onclick=function(){lang='en';render()};
document.getElementById('les').onclick=function(){lang='es';render()};
